<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYE Level 3 - Workshop</title>
<style>
  :root {
    --bg: #f7f5f0;
    --card: #ffffff;
    --text: #222;
    --muted: #6b6b6b;
    --brand: #a52a2a;
    --accent: #2c5d8f;
    --ok: #2e8b57;
    --bad: #c0392b;
    --line: #e2dfd6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Tahoma, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
  header { background: var(--brand); color: #fff; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  header h1 { font-size: 20px; margin: 0; }
  header span { font-size: 14px; opacity: .9; direction: ltr; }
  nav.units { display: flex; gap: 8px; padding: 14px 20px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  nav.units button, nav.tabs button { padding: 8px 14px; border: 1px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 14px; }
  nav.units button.active, nav.tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  nav.tabs { display: flex; gap: 8px; padding: 12px 20px 0; flex-wrap: wrap; }
  main { max-width: 860px; margin: 0 auto; padding: 16px 20px 60px; }
  .unit-title { font-size: 22px; margin: 10px 0 4px; }
  .unit-sub { color: var(--muted); margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 10px; color: var(--brand); font-size: 17px; }
  .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  .vocab-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #faf9f5; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; direction: ltr; text-align: left; }
  .vocab-item small { color: var(--muted); direction: rtl; }
  .speak { border: none; background: var(--accent); color: #fff; border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 13px; font-family: inherit; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0; direction: ltr; text-align: left; font-size: 15px; }
  th, td { border: 1px solid var(--line); padding: 7px 10px; }
  th { background: #f3efe6; }
  .ex { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
  .ex:last-child { border-bottom: none; }
  .ex .q { margin-bottom: 6px; direction: ltr; text-align: left; font-size: 16px; }
  .choices button { margin: 3px 4px 0 0; padding: 6px 12px; border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 15px; direction: ltr; }
  .choices button.picked { background: var(--accent); color: #fff; border-color: var(--accent); }
  .fill-input { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 15px; font-family: inherit; direction: ltr; width: 200px; }
  .fb { margin-top: 4px; font-size: 14px; min-height: 18px; direction: ltr; text-align: left; }
  .fb.ok { color: var(--ok); }
  .fb.bad { color: var(--bad); }
  .check-btn { margin-top: 8px; padding: 9px 18px; border: none; border-radius: 8px; background: var(--brand); color: #fff; cursor: pointer; font-family: inherit; font-size: 15px; }
  .score { margin-top: 10px; font-weight: bold; }
  .speak-card { background: #fff; border-right: 5px solid var(--accent); }
  .speak-card p { margin: 6px 0; direction: ltr; text-align: left; }
  .tip { color: var(--muted); font-size: 14px; }
  ul.dots { padding-right: 20px; margin: 6px 0; }
  ul.dots li { margin-bottom: 4px; }
  .dict-sentence { direction: ltr; text-align: left; font-size: 30px; line-height: 1.7; font-weight: 600; min-height: 70px; word-wrap: break-word; margin: 10px 0 16px; }
  .dict-sentence .ok { color: var(--text); }
  .dict-sentence .next { color: var(--accent); text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 6px; }
  .dict-sentence .todo { color: #bbb; }
  .dict-sentence .bad { color: var(--bad) !important; }
  .dict-sentence.hidden .dash { display: inline-block; width: 0.5em; height: 3px; margin: 0 0.05em; vertical-align: middle; border-radius: 2px; background: #bbb; }
  .dict-sentence.hidden .dash.next { background: var(--accent); }
  .dict-sentence.hidden .dash.bad { background: var(--bad) !important; }
  .dict-sentence.hidden .punct { color: #999; }
  .dict-sentence.hidden .gap { display: inline-block; width: 0.6em; }
  .dict-input { width: 100%; padding: 10px; font-size: 18px; border: 1px solid var(--line); border-radius: 8px; direction: ltr; text-align: left; font-family: inherit; }
  .dict-toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .dict-toolbar button { padding: 7px 12px; border: 1px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; font-family: inherit; }
  .dict-dark { position: relative; background: #000; color: #f2f2f5; border-radius: 16px; padding: 22px 24px 26px; }
  .dict-dark .d-top { display: flex; justify-content: flex-end; color: #9a9aa6; font-size: 14px; direction: ltr; margin-bottom: 8px; }
  .dict-dark .d-bar { height: 4px; background: #1c1c24; border-radius: 4px; overflow: hidden; margin-bottom: 22px; }
  .dict-dark .d-bar-fill { height: 100%; background: #6f8cff; transition: width 0.3s; }
  .dict-dark .d-controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 26px; flex-wrap: wrap; }
  .dict-dark .d-pill { background: #14141a; border: 1px solid #2a2a33; color: #f2f2f5; border-radius: 999px; padding: 8px 16px; cursor: pointer; font-family: inherit; font-size: 14px; }
  .dict-dark .d-pill:hover { border-color: #6f8cff; }
  .dict-dark .d-line { width: 56px; height: 1px; background: #2a2a33; margin-bottom: 18px; }
  .dict-dark .dict-sentence { direction: ltr; text-align: left; font-size: 40px; line-height: 1.6; font-weight: 600; min-height: 110px; word-wrap: break-word; cursor: text; color: #f2f2f5; }
  .dict-dark .dict-sentence .ok { color: #f2f2f5; }
  .dict-dark .dict-sentence .next { color: #6f8cff; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 8px; }
  .dict-dark .dict-sentence .todo { color: #3a3a44; }
  .dict-dark .dict-sentence .bad { color: #ff6b6b !important; }
  .dict-dark .dict-sentence.hidden .dash { display: inline-block; width: 0.5em; height: 3px; margin: 0 0.05em; vertical-align: middle; border-radius: 2px; background: #3a3a44; }
  .dict-dark .dict-sentence.hidden .dash.next { background: #6f8cff; }
  .dict-dark .dict-sentence.hidden .dash.bad { background: #ff6b6b !important; }
  .dict-dark .dict-sentence.hidden .punct { color: #3a3a44; }
  .dict-dark .dict-sentence.hidden .gap { display: inline-block; width: 0.6em; }
  .dict-dark #dictTyper { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; border: none; padding: 0; }
  .dict-dark .fb { min-height: 22px; margin-top: 12px; direction: ltr; text-align: left; font-size: 16px; color: #4cc38a; }
  .dict-dark .fb.bad { color: #ff6b6b; }
  .dict-dark .d-hint { color: #9a9aa6; font-size: 13px; margin-top: 18px; }
  .dict-dark .check-btn { background: #6f8cff; }

  /* ===== الوضع الداكن للموقع كله ===== */
  body { background: #000; color: #e8e8ee; }
  header { background: #2a0f0f; }
  nav.units { background: #0b0b0e; border-bottom-color: #22222b; }
  nav.units button, nav.tabs button { background: #16161c; color: #e8e8ee; border-color: #2a2a33; }
  nav.units button:hover, nav.tabs button:hover { border-color: #6f8cff; }
  nav.units button.active, nav.tabs button.active { background: #6f8cff; border-color: #6f8cff; color: #fff; }
  .unit-title { color: #f2f2f5; }
  .unit-sub, .tip { color: #9a9aa6; }
  .card { background: #0f0f14; border-color: #22222b; }
  .card h3 { color: #ff8a8a; }
  .vocab-item { background: #16161c; border-color: #2a2a33; color: #e8e8ee; }
  .vocab-item small { color: #9a9aa6; }
  table, th, td { border-color: #2a2a33; color: #e8e8ee; }
  th { background: #1c1c24; }
  .ex { border-bottom-color: #2a2a33; }
  .choices button { background: #16161c; color: #e8e8ee; border-color: #2a2a33; }
  .choices button:hover { border-color: #6f8cff; }
  .choices button.picked { background: #6f8cff; border-color: #6f8cff; color: #fff; }
  .fill-input { background: #16161c; color: #e8e8ee; border-color: #2a2a33; }
  .speak-card { background: #0f0f14; border-right-color: #6f8cff; }
  .speak-card p { color: #e8e8ee; }
  .check-btn { background: #6f8cff; }
  .score { color: #e8e8ee; }
  .fb.ok { color: #4cc38a; }
  .fb.bad { color: #ff6b6b; }
  .speak { background: #6f8cff; }
  .dict-dark .dict-sentence { font-size: 30px; min-height: 140px; }
  .dict-dark .d-nav { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .dict-dark .d-pill:disabled { opacity: 0.4; cursor: default; }
  .dict-dark .d-stats { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: #9a9aa6; font-size: 14px; direction: ltr; margin-bottom: 16px; }
</style>
</head>
<body>
<header>
  <h1>ورشة المستوى الثالث - SYE English Community</h1>
  <span>Level 3 Workshop</span>
</header>

<nav class="units" id="unitNav"></nav>
<nav class="tabs" id="tabNav"></nav>
<main id="main"></main>

<script>
  // ===== المحتوى =====
  const UNITS = [
    {
      title: "الوحدة الأولى: العادات والمضارع البسيط",
      sub: "Habits, present simple (positive & negative), why / because",
      vocab: [
        { en: "Wake up early", ar: "يصحى بدري", group: "Good habit" },
        { en: "Do homework", ar: "يذاكر / يعمل الواجب", group: "Good habit" },
        { en: "Do sports", ar: "يمارس رياضة", group: "Good habit" },
        { en: "Brush your teeth", ar: "ينضف أسنانه", group: "Good habit" },
        { en: "Drink water", ar: "يشرب مية", group: "Good habit" },
        { en: "Go to the gym", ar: "يروح الجيم", group: "Good habit" },
        { en: "Wake up late", ar: "يصحى متأخر", group: "Bad habit" },
        { en: "Watch TV a lot", ar: "يتفرج على التلفزيون كتير", group: "Bad habit" },
        { en: "Smoke", ar: "يدخن", group: "Bad habit" },
        { en: "Bite your nails", ar: "يعض أظافره", group: "Bad habit" },
        { en: "Drink a lot of coffee", ar: "يشرب قهوة كتير", group: "Bad habit" },
        { en: "Eat lots of sugar", ar: "ياكل سكر كتير", group: "Bad habit" },
        { en: "in the morning", ar: "في الصبح", group: "Time" },
        { en: "in the afternoon", ar: "بعد الظهر", group: "Time" },
        { en: "in the evening", ar: "بالليل (المساء)", group: "Time" },
        { en: "at night", ar: "بالليل (متأخر)", group: "Time" },
        { en: "every day", ar: "كل يوم", group: "Time" },
        { en: "every week", ar: "كل أسبوع", group: "Time" },
        { en: "at the weekend", ar: "في الويك إند", group: "Time" }
      ],
      grammar: `
        <div class="card">
          <h3>المضارع البسيط (Present Simple) - الإيجاب</h3>
          <p>بنستخدمه للعادات والحاجات اللي بتتكرر. الشكل:</p>
          <table>
            <tr><th>Subject</th><th>Verb</th><th>Complement</th></tr>
            <tr><td>I / we / you / they</td><td>play (base form)</td><td>football every day.</td></tr>
            <tr><td>he / she / it</td><td>plays (+ s / es / ies)</td><td>football every day.</td></tr>
          </table>
          <h3>الإضافات مع he / she / it</h3>
          <ul class="dots">
            <li>أغلب الأفعال: + s ➜ work → works</li>
            <li>تنتهي بـ s, sh, ch, x: + es ➜ watch → watches, fix → fixes, teach → teaches</li>
            <li>تنتهي بـ consonant + y: غيّر y إلى ies ➜ study → studies, try → tries</li>
            <li>تنتهي بـ vowel + y: زوّد s عادي ➜ enjoy → enjoys, stay → stays</li>
            <li>الفعل have ➜ has</li>
          </ul>
        </div>
        <div class="card">
          <h3>المضارع البسيط - النفي</h3>
          <table>
            <tr><th>Subject</th><th>do / does + not</th><th>verb (base form)</th></tr>
            <tr><td>I / we / you / they</td><td>don't</td><td>play</td></tr>
            <tr><td>he / she / it</td><td>doesn't</td><td>play (من غير s)</td></tr>
          </table>
          <p class="tip">مهم: بعد doesn't الفعل بيكون من غير s.</p>
        </div>
        <div class="card">
          <h3>why و because</h3>
          <p>السؤال: <b>Why do you study English?</b></p>
          <p>الجواب: <b>Because I want to improve my speaking.</b></p>
          <p>أو بصيغة to + verb: <b>To improve my speaking.</b></p>
        </div>
      `,
      exercises: [
        { type: "choose", q: "She ___ coffee every morning.", options: ["drink", "drinks"], answer: "drinks" },
        { type: "choose", q: "He ___ TV at night.", options: ["watch", "watches"], answer: "watches" },
        { type: "choose", q: "My sister ___ her teeth every morning.", options: ["brush", "brushes"], answer: "brushes" },
        { type: "fill", q: "My brother ___ (not / go) to the gym.", answer: ["doesn't go"] },
        { type: "fill", q: "Ahmed ___ (study) English.", answer: ["studies"] },
        { type: "fill", q: "She ___ (not / eat) sugar.", answer: ["doesn't eat"] },
        { type: "fill", q: "We ___ (have) breakfast at 7.", answer: ["have"] },
        { type: "choose", q: "I ___ football at the weekend.", options: ["play", "plays"], answer: "play" },
        { type: "fill", q: "Sara ___ (read) books before bed.", answer: ["reads"] },
        { type: "choose", q: "Why do you study English? ___ I want to travel.", options: ["Because", "Why"], answer: "Because" }
      ],
      speaking: [
        { title: "تكلم عن عاداتك الجيدة والسيئة", lines: ["I wake up early. I do sports.", "I don't smoke. I drink a lot of coffee."], tip: "اختار 7 عادات جيدة و7 سيئة وتكلم عنهم" },
        { title: "اتكلم عن عادات شخص من أهلك", lines: ["My father wakes up early.", "My sister doesn't watch TV a lot."], tip: "الأب، الأم، الأخت، الأخ" },
        { title: "أسئلة للحوار", lines: ["Do you bite your nails?", "Do you come to class late?", "How many hours do you sleep at night?", "What are your friends' bad habits?"], tip: "اسأل زميلك واكتب إجابته" }
      ]
    },
    {
      title: "الوحدة الثانية: الشغل في البيت والأسئلة",
      sub: "Jobs around the house, housework, yes/no and wh- questions",
      vocab: [
        { en: "clean the bathroom", ar: "ينضف الحمام", group: "Chores" },
        { en: "cook dinner / lunch", ar: "يعمل العشا / الغدا", group: "Chores" },
        { en: "feed the dog", ar: "يطعم الكلب", group: "Chores" },
        { en: "walk the dog", ar: "يخرج بالكلب يتمشى", group: "Chores" },
        { en: "make the bed(s)", ar: "يرتب السرير", group: "Chores" },
        { en: "wash the dishes", ar: "يغسل الأطباق", group: "Chores" },
        { en: "do the washing / do the laundry", ar: "يغسل الهدوم", group: "Chores" },
        { en: "go to the supermarket", ar: "يروح السوبر ماركت", group: "Chores" },
        { en: "clean the bedroom", ar: "ينضف الأوضة", group: "Chores" },
        { en: "do jobs around the house", ar: "يعمل شغل البيت", group: "Chores" }
      ],
      grammar: `
        <div class="card">
          <h3>أسئلة Yes / No (Present Simple)</h3>
          <table>
            <tr><th>سؤال</th><th>جواب قصير</th></tr>
            <tr><td>Do you clean your room?</td><td>Yes, I do. / No, I don't.</td></tr>
            <tr><td>Does your mother cook dinner?</td><td>Yes, she does. / No, she doesn't.</td></tr>
            <tr><td>Does Elena clean the kitchen?</td><td>Yes, she does.</td></tr>
          </table>
          <p class="tip">القاعدة: Do مع I / you / we / they — و Does مع he / she / it. والفعل بعدهم يكون من غير s.</p>
        </div>
        <div class="card">
          <h3>أسئلة Wh- (Present Simple)</h3>
          <p>Wh-word + do / does + subject + verb (base form)</p>
          <table>
            <tr><th>Question</th><th>Answer</th></tr>
            <tr><td>What do you do at home?</td><td>I wash the dishes.</td></tr>
            <tr><td>When does your brother walk the dog?</td><td>Every morning.</td></tr>
            <tr><td>Where does your friend work?</td><td>At a hospital.</td></tr>
            <tr><td>How often do you clean your room?</td><td>Once a week.</td></tr>
          </table>
          <p class="tip">كلمات السؤال: What, Where, When, Who, Why, How often.</p>
        </div>
      `,
      exercises: [
        { type: "fill", q: "She ___ (clean) the bathroom on Fridays.", answer: ["cleans"] },
        { type: "choose", q: "He ___ the dog every morning.", options: ["feed", "feeds"], answer: "feeds" },
        { type: "fill", q: "___ your father cook dinner? (Does / Do)", answer: ["does"] },
        { type: "choose", q: "___ you wash the dishes?", options: ["Do", "Does"], answer: "Do" },
        { type: "fill", q: "Does she do the washing? Yes, she ___.", answer: ["does"] },
        { type: "fill", q: "My mother ___ (not / make) the beds.", answer: ["doesn't make"] },
        { type: "choose", q: "How often ___ you go to the supermarket?", options: ["do", "does"], answer: "do" },

        { type: "choose", q: "Which means the same as \"do the laundry\"?", options: ["do the washing", "make the bed"], answer: "do the washing" },
        { type: "fill", q: "Where ___ your brother ___ (walk) the dog? - In the park.", answer: ["does walk"] }
      ],
      speaking: [
        { title: "ما هو الشغل اللي بتعمله في البيت؟", lines: ["What housework do you do at home?", "I wash the dishes and I clean my room."], tip: "اتكلم عن نفسك" },

        { title: "Find someone who...", lines: ["Do you clean your room?  How often do you clean your room?", "Does your mother do the laundry?  When does she do the laundry?"], tip: "اسأل زملاءك واكتب المعلومات: Where / When / What / how often / why" }
      ]
    },
    {
      title: "الوحدة الثالثة: الماضي البسيط",
      sub: "Past simple (regular & irregular), was/were, ed sounds, past questions",
      vocab: [
        { en: "get up / got up", ar: "صحي", group: "Irregular" },
        { en: "break / broke", ar: "كسر", group: "Irregular" },
        { en: "take / took", ar: "أخد", group: "Irregular" },
        { en: "buy / bought", ar: "اشترى", group: "Irregular" },
        { en: "meet / met", ar: "قابل", group: "Irregular" },
        { en: "lose / lost", ar: "ضيّع", group: "Irregular" },
        { en: "feel / felt", ar: "حس", group: "Irregular" },
        { en: "speak / spoke", ar: "اتكلم", group: "Irregular" },
        { en: "have / had", ar: "كان عنده / أكل (قعد)", group: "Irregular" },
        { en: "go / went", ar: "راح", group: "Irregular" },
        { en: "run / ran", ar: "جرى", group: "Irregular" },
        { en: "eat / ate", ar: "أكل", group: "Irregular" },
        { en: "forget / forgot", ar: "نسي", group: "Irregular" },
        { en: "see / saw", ar: "شاف", group: "Irregular" },
        { en: "visit / visited", ar: "زار", group: "Regular" },
        { en: "watch / watched", ar: "اتفرج", group: "Regular" },
        { en: "play / played", ar: "لعب", group: "Regular" },
        { en: "study / studied", ar: "ذاكر", group: "Regular" }
      ],
      grammar: `
        <div class="card">
          <h3>الماضي البسيط - الإيجاب</h3>
          <p>Subject + verb (past) + complement</p>
          <ul class="dots">
            <li>Regular: + ed ➜ walk → walked, visit → visited</li>
            <li>Regular تنتهي بـ e: + d ➜ live → lived</li>
            <li>Regular تنتهي بـ consonant + y: ➜ study → studied</li>
            <li>Irregular: لازم تحفظها (زي الجدول اللي فوق)</li>
          </ul>
          <h3>نطق ed</h3>
          <table>
            <tr><th>/t/</th><th>/d/</th><th>/id/</th></tr>
            <tr><td>helped, watched, washed, laughed</td><td>called, played, cleaned, loved</td><td>waited, needed (آخر حرف d أو t)</td></tr>
          </table>
          <p class="tip">لو آخر صوت في الكلمة "مهموس" (زي p, k, s, sh, ch) ➜ /t/. لو "مجهور" (زي l, v, m, n) ➜ /d/.</p>
        </div>

  function statOf(i) {
    if (!dictStats[i]) dictStats[i] = { c: 0, w: 0 };
    return dictStats[i];
  }
  function totals() {
    return Object.values(dictStats).reduce((a, s) => ({ c: a.c + s.c, w: a.w + s.w }), { c: 0, w: 0 });
  }
  let dictIdx = 0;
  let dictVisible = true;
  let dPos = 0;
  let dFlash = -1;
  let dFlashTimer = null;
  let dLocked = false;

  // تنظيف النص قبل النطق: "/" تتقري "أو"، والأقواس تتشال
  function cleanForSpeech(t) {
    return t.replace(/\(s\)/g, "s").replace(/\//g, " or ").replace(/[()]/g, "").replace(/\s+/g, " ").trim();
  }

  function dTarget() { return ALL_DICT[dictIdx]; }
  function isPunctD(ch) { return !/[A-Za-z ]/.test(ch); }
  function skipPunctD(p) {
    const t = dTarget();
    while (p < t.length && isPunctD(t[p])) p++;
    return p;
  }
  function typeCharD(ch) {
    const t = dTarget();
    if (dPos >= t.length) return false;
    if (ch.toLowerCase() === t[dPos].toLowerCase()) {
      dPos = skipPunctD(dPos + 1);
      return true;
    }
    return false;
  }
  function backspaceD() {
    const t = dTarget();
    let p = dPos - 1;
    while (p > 0 && isPunctD(t[p])) p--;
    dPos = Math.max(0, p);
  }

  function renderDictSentence() {
    const t = dTarget();
    const el = document.getElementById("dictSentence");
    if (!el) return;
    el.className = "dict-sentence" + (dictVisible ? "" : " hidden");
    let html = "";
    for (let i = 0; i < t.length; i++) {
      const ch = t[i];
      if (ch === " ") {
        html += dictVisible ? " " : '<span class="gap"></span>';
        continue;
      }
      const done = i < dPos;
      const next = i === dPos;
      const bad = i === dFlash;
      if (dictVisible) {
        let cls = done ? "ok" : next ? "next" : "todo";
        if (bad) cls = "bad";
        html += '<span class="' + cls + '">' + ch + '</span>';
      } else if (done) {
        html += '<span class="ok">' + ch + '</span>';
      } else if (isPunctD(ch)) {
        html += '<span class="punct">/</span>';
      } else {
        let cls = "dash";
        if (next) cls += " next";
        if (bad) cls += " bad";
        html += '<span class="' + cls + '"></span>';
      }
    }
    el.innerHTML = html;
  }

  function wireDictation() {
    const rb = document.getElementById("dictRestart");
    if (rb) {
      rb.onclick = () => { dictIdx = 0; renderAll(); };
      return;
    }
    const typer = document.getElementById("dictTyper");
    if (!typer) return;

    // نبدأ الجملة من أول الكتابة لما الجملة تتغير بس
    const key = dictIdx;
    if (dKey !== key) {
      dKey = key;
      dPos = skipPunctD(0);
      dFlash = -1;
      dLocked = false;
      speak(dTarget());
    }
    renderDictSentence();
    document.getElementById("dictSentence").onclick = () => typer.focus();
    typer.focus();

    typer.addEventListener("input", e => {
      const raw = typer.value;
      typer.value = "";
      if (dLocked) return;

      if (e.inputType && e.inputType.startsWith("delete")) {
        backspaceD();
        dFlash = -1;
        renderDictSentence();
        return;
      }

      let wrong = false;
      for (const ch of raw) {
        if (typeCharD(ch)) {
          statOf(dictIdx).c++;
        } else {
          statOf(dictIdx).w++;
          wrong = true;
          break;
        }
      }
      saveDict();
      if (wrong) {
        dFlash = dPos;
        clearTimeout(dFlashTimer);
        dFlashTimer = setTimeout(() => { dFlash = -1; renderDictSentence(); }, 350);
      }
      renderDictSentence();

      if (dPos >= dTarget().length) {
        dLocked = true;
        const fb = document.getElementById("dictFb");
        fb.className = "fb ok";
        fb.textContent = "✓ صح";
        setTimeout(() => { dictIdx++; saveDict(); renderAll(); }, 700);
      }
    });

    typer.addEventListener("keydown", e => {
      if (e.key === "Backspace") {
        e.preventDefault();
        backspaceD();
        dFlash = -1;
        renderDictSentence();
      }
    });

    document.getElementById("dictPrev").onclick = () => {
      if (dictIdx > 0) { dictIdx--; saveDict(); renderAll(); }
    };
    document.getElementById("dictRedo").onclick = () => {
      dPos = skipPunctD(0);
      dFlash = -1;
      dLocked = false;
      renderDictSentence();
      typer.focus();
    };
    document.getElementById("dictSkip").onclick = () => {
      dictIdx = Math.min(dictIdx + 1, ALL_DICT.length);

      renderAll();

    document.getElementById("dictReplay").onclick = () => speak(dTarget());
    document.getElementById("dictToggle").onclick = () => {
      dictVisible = !dictVisible;
      renderAll();
    };
  }

  // ===== الصوت =====
  // اختيار أطبع صوت إنجليزي متاح على الجهاز
  let cachedVoice = null;
  function getVoice() {
    if (cachedVoice) return cachedVoice;
    const all = speechSynthesis.getVoices();
    const en = all.filter(v => /^en/i.test(v.lang));
    const prefs = [/natural/i, /google us english/i, /aria|jenny|guy|ava|emma|michelle|andrew/i, /samantha|zira|david/i];
    for (const p of prefs) {
      const found = en.find(v => p.test(v.name));
      if (found) { cachedVoice = found; return found; }
    }
    cachedVoice = en[0] || null;
    return cachedVoice;
  }
  if ("speechSynthesis" in window) {
    speechSynthesis.onvoiceschanged = () => { cachedVoice = null; };
  }

  function speak(text) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(cleanForSpeech(text));
    const voice = getVoice();
    if (voice) u.voice = voice;
    u.lang = voice ? voice.lang : "en-US";
    u.rate = 0.85;
    u.pitch = 1;
    speechSynthesis.speak(u);
  }

        </div>
      </div>`).join("");
  }

  function renderExercises(u) {
    return `
      <div class="card" id="exCard">
        ${u.exercises.map((ex, i) => {
          if (ex.type === "choose") {
            return `<div class="ex" data-i="${i}">
              <div class="q">${i + 1}. ${ex.q}</div>
              <div class="choices">${ex.options.map(o => `<button data-v="${o}">${o}</button>`).join("")}</div>
              <div class="fb"></div>
            </div>`;
          }
          return `<div class="ex" data-i="${i}">
            <div class="q">${i + 1}. ${ex.q}</div>
            <input class="fill-input" type="text" autocomplete="off" spellcheck="false">
            <div class="fb"></div>
          </div>`;
        }).join("")}
        <button class="check-btn" id="checkBtn">تحقق من الإجابات</button>
        <div class="score" id="scoreBox"></div>
      </div>`;
  }

  function wireExercises(u) {
    const picked = {};
    document.querySelectorAll("#exCard .ex").forEach(box => {
      const i = Number(box.dataset.i);
      const ex = u.exercises[i];
      if (ex.type === "choose") {
        box.querySelectorAll(".choices button").forEach(b => b.onclick = () => {
          box.querySelectorAll(".choices button").forEach(x => x.classList.remove("picked"));
          b.classList.add("picked");
          picked[i] = b.dataset.v;
        });
      }
    });

    document.getElementById("checkBtn").onclick = () => {
      let correct = 0;
      document.querySelectorAll("#exCard .ex").forEach(box => {
        const i = Number(box.dataset.i);
        const ex = u.exercises[i];
        const fb = box.querySelector(".fb");
        let val;
        if (ex.type === "choose") {
          val = picked[i];
        } else {
          val = box.querySelector("input").value.trim().toLowerCase();
        }
        if (!val) {
          fb.className = "fb";
          fb.textContent = "";
          return;
        }
        const answers = ex.type === "choose" ? [ex.answer] : ex.answer;
        const ok = answers.map(a => a.toLowerCase()).includes(val.toLowerCase());
        if (ok) correct++;
        fb.className = "fb " + (ok ? "ok" : "bad");
        fb.textContent = ok ? "✓ صح" : "✗ الإجابة الصحيحة: " + (ex.type === "choose" ? ex.answer : ex.answer[0]);
      });
      document.getElementById("scoreBox").textContent =
        "النتيجة: " + correct + " من " + u.exercises.length;
    };
  }

  function renderSpeaking(u) {
    return u.speaking.map(s => `
      <div class="card speak-card">
        <h3>${s.title}</h3>
        ${s.lines.map(l => `<p>${l}</p>`).join("")}
        <p class="tip">${s.tip}</p>
      </div>`).join("");
  }

  function renderAll() {
    renderNav();
    const u = UNITS[unitIndex];
    const main = document.getElementById("main");
    let body = "";

    if (tabName === "vocab") body = renderVocab(u);
    else if (tabName === "grammar") body = u.grammar;
    else if (tabName === "exercises") body = renderExercises(u);
    else if (tabName === "speaking") body = renderSpeaking(u);
    else if (tabName === "dictation") body = renderDictationShell();

    main.innerHTML = `
      <div class="unit-title">${u.title}</div>
      <p class="unit-sub">${u.sub}</p>
      ${body}`;

    main.querySelectorAll(".speak").forEach(b => b.onclick = () => speak(b.dataset.say));
    if (tabName === "exercises") wireExercises(u);
    if (tabName === "dictation") wireDictation();
  }

  if (studentName) {
    loadDict().then(renderAll);
  } else {
    renderNameScreen();
  }
</script>
</body>
</html>
