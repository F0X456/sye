<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYE Level 3 - Workshop</title>
<style>
  :root { --brand: #2a0f0f; --accent: #6f8cff; --ok: #4cc38a; --bad: #ff6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Tahoma, Arial, sans-serif; background: #000; color: #e8e8ee; line-height: 1.6; }
  header { background: var(--brand); color: #fff; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  header h1 { font-size: 20px; margin: 0; }
  header span { font-size: 14px; opacity: .9; }
  nav.units { display: flex; gap: 8px; padding: 14px 20px; background: #0b0b0e; border-bottom: 1px solid #22222b; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  nav.tabs { display: flex; gap: 8px; padding: 12px 20px 0; flex-wrap: wrap; }
  nav button { padding: 8px 14px; border: 1px solid #2a2a33; background: #16161c; color: #e8e8ee; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 14px; }
  nav button:hover { border-color: var(--accent); }
  nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { max-width: 860px; margin: 0 auto; padding: 16px 20px 60px; }
  .unit-title { font-size: 22px; margin: 10px 0 4px; color: #f2f2f5; }
  .unit-sub, .tip { color: #9a9aa6; font-size: 14px; }
  .unit-sub { margin: 0 0 16px; }
  .card { background: #0f0f14; border: 1px solid #22222b; border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 10px; color: #ff8a8a; font-size: 17px; }
  .card p { margin: 6px 0; }
  .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  .vocab-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #16161c; border: 1px solid #2a2a33; border-radius: 8px; padding: 8px 12px; }
  .speak { border: none; background: var(--accent); color: #fff; border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 13px; font-family: inherit; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 15px; }
  th, td { border: 1px solid #2a2a33; padding: 7px 10px; text-align: left; }
  th { background: #1c1c24; }
  ul.dots { padding-left: 20px; margin: 6px 0; }
  ul.dots li { margin-bottom: 4px; }
  .ex { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px dashed #2a2a33; }
  .ex:last-child { border-bottom: none; }
  .ex .q { margin-bottom: 6px; font-size: 16px; }
  .choices button { margin: 3px 4px 0 0; padding: 6px 12px; border: 1px solid #2a2a33; background: #16161c; color: #e8e8ee; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 15px; }
  .choices button:hover { border-color: var(--accent); }
  .choices button.picked { background: var(--accent); border-color: var(--accent); color: #fff; }
  .fill-input { padding: 6px 10px; background: #16161c; color: #e8e8ee; border: 1px solid #2a2a33; border-radius: 6px; font-size: 15px; font-family: inherit; width: 220px; }
  .fb { margin-top: 4px; font-size: 14px; min-height: 18px; }
  .fb.ok { color: var(--ok); }
  .fb.bad { color: var(--bad); }
  .check-btn { margin-top: 8px; padding: 9px 18px; border: none; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; font-family: inherit; font-size: 15px; }
  .score { margin-top: 10px; font-weight: bold; }
  .speak-card { border-right: 5px solid var(--accent); }
  .speak-card p { font-size: 16px; }

  /* Dictation panel */
  .dict-dark { position: relative; background: #000; color: #f2f2f5; border-radius: 16px; padding: 22px 24px 26px; }
  .d-top { display: flex; justify-content: flex-end; color: #9a9aa6; font-size: 14px; margin-bottom: 8px; }
  .d-bar { height: 4px; background: #1c1c24; border-radius: 4px; overflow: hidden; margin-bottom: 22px; }
  .d-bar-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
  .d-controls, .d-nav { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .d-pill { background: #14141a; border: 1px solid #2a2a33; color: #f2f2f5; border-radius: 999px; padding: 8px 16px; cursor: pointer; font-family: inherit; font-size: 14px; }
  .d-pill:hover { border-color: var(--accent); }
  .d-pill:disabled { opacity: 0.4; cursor: default; }
  .d-stats { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: #9a9aa6; font-size: 14px; margin-bottom: 16px; }
  .d-line { width: 56px; height: 1px; background: #2a2a33; margin-bottom: 18px; }
  .dict-sentence { font-size: 30px; line-height: 1.6; font-weight: 600; min-height: 140px; word-wrap: break-word; cursor: text; color: #f2f2f5; }
  .dict-sentence .ok { color: #f2f2f5; }
  .dict-sentence .next { color: var(--accent); text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 8px; }
  .dict-sentence .todo { color: #3a3a44; }
  .dict-sentence .bad { color: var(--bad) !important; }
  .dict-sentence.hidden .dash { display: inline-block; width: 0.5em; height: 3px; margin: 0 0.05em; vertical-align: middle; border-radius: 2px; background: #3a3a44; }
  .dict-sentence.hidden .dash.next { background: var(--accent); }
  .dict-sentence.hidden .dash.bad { background: var(--bad) !important; }
  .dict-sentence.hidden .punct { color: #3a3a44; }
  .dict-sentence.hidden .gap { display: inline-block; width: 0.6em; }
  #dictTyper { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; border: none; padding: 0; }
  .dict-dark .fb { min-height: 22px; margin-top: 12px; font-size: 16px; color: var(--ok); }
  .dict-dark .fb.bad { color: var(--bad); }
  .dict-dark .d-hint { color: #9a9aa6; font-size: 13px; margin-top: 18px; }
  .done { text-align: center; padding: 40px 0; }
  .name-input { width: 100%; padding: 10px; background: #16161c; color: #e8e8ee; border: 1px solid #2a2a33; border-radius: 8px; font-size: 16px; margin-bottom: 10px; font-family: inherit; }
</style>
</head>

  // ===== Voice =====
  let cachedVoice = null;
  function getVoice() {
    if (cachedVoice) return cachedVoice;
    const en = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    const prefs = [/natural/i, /google us english/i, /aria|jenny|guy|ava|emma|michelle|andrew/i, /samantha|zira|david/i];
    for (const p of prefs) {
      const found = en.find(v => p.test(v.name));
      if (found) { cachedVoice = found; return found; }
    }
    cachedVoice = en[0] || null;
    return cachedVoice;
  }
  if ("speechSynthesis" in window) {
    speechSynthesis.onvoiceschanged = () => { cachedVoice = null; };
  }

  function cleanForSpeech(t) {
    return t.replace(/\(s\)/g, "s").replace(/\//g, " or ").replace(/[()]/g, "").replace(/\s+/g, " ").trim();
  }

  function speak(text) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(cleanForSpeech(text));
    const voice = getVoice();
    if (voice) u.voice = voice;
    u.lang = voice ? voice.lang : "en-US";
    u.rate = 0.85;
    u.pitch = 1;
    speechSynthesis.speak(u);
  }

  // ===== Supabase =====
  async function sbFetch(path, opts = {}) {
    try {
      const res = await fetch(SB_URL + "/rest/v1/" + path, {
        ...opts,
        headers: {
          apikey: SB_KEY,
          Authorization: "Bearer " + SB_KEY,
          "Content-Type": "application/json",
          ...(opts.headers || {})
        }
      });
      if (!res.ok) return null;
      return res.status === 204 ? true : res.json();
    } catch (e) {
      return null;
    }
  }

  // Extra sentences and words added by the admin
  // Format: fill | question | answer1 ; answer2
  //         choose | question | option1 ; option2 | correct option
  function parseExercises(text) {
    return text.split("\n").map(l => l.trim()).filter(Boolean).map(line => {
      const p = line.split("|").map(s => s.trim());
      if (p[0] === "choose") {
        return { type: "choose", q: p[1] || "", options: (p[2] || "").split(";").map(s => s.trim()).filter(Boolean), answer: p[3] || "" };
      }
      return { type: "fill", q: p[1] || "", answer: (p[2] || "").split(";").map(s => s.trim()).filter(Boolean) };
    }).filter(e => e.q);
  }

  // Format: title | line one ; line two | tip
  function parseSpeaking(text) {
    return text.split("\n").map(l => l.trim()).filter(Boolean).map(line => {
      const p = line.split("|").map(s => s.trim());
      return { title: p[0] || "", lines: (p[1] || "").split(";").map(s => s.trim()).filter(Boolean), tip: p[2] || "" };
    });
  }

  // One line per paragraph
  function formatGrammar(text) {
    const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
    return '<div class="card">' + lines.map(l => '<p>' + escapeText(l) + '</p>').join("") + '</div>';
  }

  async function loadExtras() {
    // Units created by the admin (they come after the built-in units, in order)
    const units = await sbFetch("units?select=*&order=unit_no.asc");
    if (units) {
      units.forEach(u => UNITS.push({
        title: u.title,
        sub: u.sub || "",
        vocab: [],
        grammar: formatGrammar(u.grammar || ""),
        exercises: parseExercises(u.exercises || ""),
        speaking: parseSpeaking(u.speaking || "")
      }));
    }
    const [sents, words] = await Promise.all([
      sbFetch("sentences?select=*&order=position.asc,id.asc"),
      sbFetch("words?select=*&order=id.asc")
    ]);
    if (sents && sents.length) ALL_DICT = DICTATION.flat().concat(sents.map(r => r.en));
    if (words) {
      words.forEach(w => {
        const idx = Math.min(Math.max(0, (w.unit || 1) - 1), UNITS.length - 1);
        UNITS[idx].vocab.push({ en: w.en, group: w.group_name || "Extra" });
        if (w.emoji) EMOJI[w.en] = w.emoji;
      });
    }
  }

  // Messages sent by the admin to this student or to everyone
  async function loadMessages() {
    if (!studentName) return;
    const rows = await sbFetch("messages?select=*&or=(to_name.eq." + encodeURIComponent(studentName) + ",to_name.eq.all)&order=created_at.desc&limit=20");
    myMessages = rows || [];
  }

  // Create a row for the student in the database if they are new
  async function ensureStudentRow() {
    const rows = await sbFetch("progress?name=eq." + encodeURIComponent(studentName) + "&select=name");
    if (rows && rows.length === 0) {
      await sbFetch("progress", {
        method: "POST",
        headers: { Prefer: "return=minimal" },
        body: JSON.stringify({ name: studentName, idx: 0, stats: {}, updated_at: new Date().toISOString() })
      });
    }
  }

  async function loadDict() {
    if (!studentName) return;
    await ensureStudentRow();
    const rows = await sbFetch("progress?name=eq." + encodeURIComponent(studentName) + "&select=*");
    if (rows && rows[0]) {
      dictIdx = Math.min(Math.max(0, rows[0].idx || 0), ALL_DICT.length);
      dictStats = rows[0].stats || {};
    }
  }

  let saveTimer = null;
  function saveDict() {
    if (!studentName) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      sbFetch("progress?on_conflict=name", {
        method: "POST",
        headers: { Prefer: "resolution=merge-duplicates" },
        body: JSON.stringify({ name: studentName, idx: dictIdx, stats: dictStats, updated_at: new Date().toISOString() })
      });
    }, 300);
  }

  function statOf(i) {
    if (!dictStats[i]) dictStats[i] = { c: 0, w: 0 };
    return dictStats[i];
  }
  function totals() {
    return Object.values(dictStats).reduce((a, s) => ({ c: a.c + s.c, w: a.w + s.w }), { c: 0, w: 0 });
  }

  function wireExercises(u) {
    const picked = {};
    document.querySelectorAll("#exCard .ex").forEach(box => {
      const i = Number(box.dataset.i);
      if (u.exercises[i].type === "choose") {
        box.querySelectorAll(".choices button").forEach(b => b.onclick = () => {
          box.querySelectorAll(".choices button").forEach(x => x.classList.remove("picked"));
          b.classList.add("picked");
          picked[i] = b.dataset.v;
        });
      }
    });
    document.getElementById("checkBtn").onclick = () => {
      let correct = 0;
      document.querySelectorAll("#exCard .ex").forEach(box => {
        const i = Number(box.dataset.i);
        const ex = u.exercises[i];
        const fb = box.querySelector(".fb");
        const val = ex.type === "choose" ? picked[i] : box.querySelector("input").value.trim();
        if (!val) { fb.className = "fb"; fb.textContent = ""; return; }
        const answers = ex.type === "choose" ? [ex.answer] : ex.answer;
        const ok = answers.map(a => a.toLowerCase()).includes(val.toLowerCase());
        if (ok) correct++;
        fb.className = "fb " + (ok ? "ok" : "bad");
        fb.textContent = ok ? "✓ Correct" : "✗ Answer: " + (ex.type === "choose" ? ex.answer : ex.answer[0]);
      });
      document.getElementById("scoreBox").textContent = "Score: " + correct + " out of " + u.exercises.length;
    };
  }

  // ===== Speaking =====
  function renderSpeaking(u) {
    return u.speaking.map(s => `
      <div class="card speak-card">

  // ===== Dictation =====
  function dTarget() { return ALL_DICT[dictIdx]; }
  function isPunctD(ch) { return !/[A-Za-z ]/.test(ch); }
  function skipPunctD(p) {
    const t = dTarget();
    while (p < t.length && isPunctD(t[p])) p++;
    return p;
  }
  function typeCharD(ch) {
    const t = dTarget();
    if (dPos >= t.length) return false;
    if (ch.toLowerCase() === t[dPos].toLowerCase()) {
      dPos = skipPunctD(dPos + 1);
      return true;
    }
    return false;
  }
  function backspaceD() {
    const t = dTarget();
    let p = dPos - 1;
    while (p > 0 && isPunctD(t[p])) p--;
    dPos = Math.max(0, p);
  }

  // Speak only the word at the cursor
  function speakWordAt(p) {
    const t = dTarget();
    let s = p;
    while (s > 0 && t[s - 1] !== " ") s--;
    let e = p;
    while (e < t.length && t[e] !== " ") e++;
    const word = t.slice(s, e).replace(/[^A-Za-z']/g, "");
    if (word) speak(word);
  }

  function renderDictSentence() {
    const t = dTarget();
    const el = document.getElementById("dictSentence");
    if (!el) return;
    el.className = "dict-sentence" + (dictVisible ? "" : " hidden");
    let html = "";
    for (let i = 0; i < t.length; i++) {
      const ch = t[i];
      if (ch === " ") {
        html += dictVisible ? " " : '<span class="gap"></span>';
        continue;
      }
      const done = i < dPos;
      const next = i === dPos;
      const bad = i === dFlash;
      if (dictVisible) {
        let cls = done ? "ok" : next ? "next" : "todo";
        if (bad) cls = "bad";
        html += '<span class="' + cls + '">' + ch + '</span>';
      } else if (done) {
        html += '<span class="ok">' + ch + '</span>';
      } else if (isPunctD(ch)) {
        html += '<span class="punct">/</span>';
      } else {
        let cls = "dash";
        if (next) cls += " next";
        if (bad) cls += " bad";
        html += '<span class="' + cls + '"></span>';
      }
    }
    el.innerHTML = html;
  }

  function renderDictationShell() {
    const total = ALL_DICT.length;
    if (dictIdx >= total) {
      return '<div class="card done"><h3>You finished the dictation ✓</h3>' +
        '<p class="tip">Total: ✓ ' + totals().c + ' | ✗ ' + totals().w + '</p>' +
        '<button class="check-btn" id="dictRestart">Start again</button></div>';
    }
    const st = statOf(dictIdx);
    const tot = totals();
    return '<div class="dict-dark">' +
      '<div class="d-top"><span>Sentence ' + (dictIdx + 1) + ' of ' + total + '</span></div>' +
      '<div class="d-bar"><div class="d-bar-fill" style="width:' + (dictIdx / total * 100) + '%"></div></div>' +
      '<div class="d-controls">' +
        '<button class="d-pill" id="dictToggle">' + (dictVisible ? "Hide text" : "Show text") + '</button>' +
        '<button class="d-pill" id="dictReplay">🎧 Listen again (Shift)</button>' +
      '</div>' +
      '<div class="d-nav">' +
        '<button class="d-pill" id="dictPrev"' + (dictIdx === 0 ? ' disabled' : '') + '>← Previous</button>' +
        '<button class="d-pill" id="dictRedo">↻ Retype sentence</button>' +
        '<button class="d-pill" id="dictSkip">Next →</button>' +
      '</div>' +
      '<div class="d-stats">' +
        '<span>This sentence: ✓ ' + st.c + ' | ✗ ' + st.w + '</span>' +
        '<span>Total: ✓ ' + tot.c + ' | ✗ ' + tot.w + '</span>' +
      '</div>' +
      '<div class="d-line"></div>' +
      '<div class="dict-sentence" id="dictSentence"></div>' +
      '<div class="fb" id="dictFb"></div>' +
      '<div class="d-hint">Tap the sentence and start typing. Punctuation is added for you. Wrong letters are not typed.</div>' +
    '</div>';
  }

  function wireDictation() {
    const rb = document.getElementById("dictRestart");
    if (rb) {
      rb.onclick = () => { dictIdx = 0; saveDict(); renderAll(); };
      return;
    }
    const typer = document.getElementById("dictTyper");
    typer.style.display = "block";
    typer.style.position = "absolute";
    typer.style.opacity = "0";
    typer.style.width = "1px";
    typer.style.height = "1px";
    typer.style.pointerEvents = "none";

    const key = dictIdx;
    if (dKey !== key) {
      dKey = key;
      dPos = skipPunctD(0);
      dFlash = -1;
      dLocked = false;
      speak(dTarget());
    }
    renderDictSentence();
    document.getElementById("dictSentence").onclick = () => typer.focus();
    typer.focus();

    typer.oninput = e => {
      const raw = typer.value;
      typer.value = "";
      if (dLocked) return;

      if (e.inputType && e.inputType.startsWith("delete")) {
        backspaceD();
        dFlash = -1;
        renderDictSentence();
        return;
      }

      let wrong = false;
      for (const ch of raw) {
        if (typeCharD(ch)) {
          statOf(dictIdx).c++;
        } else {
          statOf(dictIdx).w++;
          wrong = true;
          break;
        }
      }
      saveDict();

      if (wrong) {
        speakWordAt(dPos);
        dFlash = dPos;
        clearTimeout(dFlashTimer);
        dFlashTimer = setTimeout(() => { dFlash = -1; renderDictSentence(); }, 350);
      }
      renderDictSentence();

      if (dPos >= dTarget().length) {
        dLocked = true;
        const fb = document.getElementById("dictFb");
        fb.className = "fb ok";
        fb.textContent = "✓ Correct";
        setTimeout(() => { dictIdx++; saveDict(); renderAll(); }, 700);
      }
    };

    typer.onkeydown = e => {
      if (e.key === "Backspace") {
        e.preventDefault();
        backspaceD();
        dFlash = -1;
        renderDictSentence();
      }
    };

    document.getElementById("dictPrev").onclick = () => {
      if (dictIdx > 0) { dictIdx--; saveDict(); renderAll(); }
    };
    document.getElementById("dictRedo").onclick = () => {
      dPos = skipPunctD(0);
      dFlash = -1;
      dLocked = false;
      renderDictSentence();
      typer.focus();
    };
    document.getElementById("dictSkip").onclick = () => {
      dictIdx = Math.min(dictIdx + 1, ALL_DICT.length);
      saveDict();
      renderAll();
    };
    document.getElementById("dictReplay").onclick = () => speak(dTarget());
    document.getElementById("dictToggle").onclick = () => {
      dictVisible = !dictVisible;
      renderAll();
    };
  }

  // Shift replays the dictation sentence
  document.addEventListener("keydown", e => {
    if (e.key === "Shift" && !e.repeat && tabName === "dictation" && studentName && dictIdx < ALL_DICT.length) {
      speak(dTarget());
    }
  });

  // ===== Name screen =====
  function renderNameScreen() {
    document.getElementById("main").innerHTML =
      '<div class="card">' +
        '<h3>Enter your name to start</h3>' +
        '<p class="tip">Your progress is saved under this name, so you can continue later.</p>' +
        '<input id="nameIn" class="name-input" placeholder="Full name">' +
        '<button class="check-btn" id="nameGo">Start</button>' +
      '</div>';
    document.getElementById("nameGo").onclick = async () => {
      const v = document.getElementById("nameIn").value.trim();
      if (!v) return;
      studentName = v;
      localStorage.setItem("sye_name", v);
      await loadDict();
      await loadMessages();
      tabName = "dictation";
      renderAll();
    };
  }

  function escapeText(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Hidden messages are remembered on this device
  function getDismissed() {
    try { return JSON.parse(localStorage.getItem("sye_dismissed") || "[]"); } catch (e) { return []; }
  }
  function dismissMessage(id) {
    const d = getDismissed();
    if (!d.includes(id)) d.push(id);
    localStorage.setItem("sye_dismissed", JSON.stringify(d));
  }

  function renderMessagesCard() {
    const dismissed = getDismissed();
    const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
    const visible = myMessages.filter(m =>
      !dismissed.includes(m.id) && new Date(m.created_at).getTime() > weekAgo
    );
    if (!visible.length) return "";
    return '<div class="card speak-card"><h3>📬 Messages from your teacher (' + visible.length + ')</h3>' +
      visible.map(m => `
        <div style="border-top:1px solid #2a2a33;padding-top:8px;margin-top:8px">
          <p>${escapeText(m.body)}</p>
          <p class="tip">${new Date(m.created_at).toLocaleDateString("en-GB")}
            <button class="speak" data-dismiss="${m.id}" style="margin-left:8px">Hide</button>
          </p>
        </div>`).join("") +
      '</div>';
  }

  // ===== Render =====
  function renderAll() {
    renderNav();
    if (!studentName) { renderNameScreen(); return; }

    const u = UNITS[unitIndex];
    const main = document.getElementById("main");
    let body = "";

    if (tabName === "words") body = renderWords(u);
    else if (tabName === "grammar") body = u.grammar;
    else if (tabName === "exercises") body = renderExercises(u);
    else if (tabName === "speaking") body = renderSpeaking(u);
    else if (tabName === "dictation") body = renderDictationShell();

    const header = tabName === "dictation"
      ? '<div class="unit-title">Dictation: all units</div><p class="unit-sub">111 sentences from Unit 1, Unit 2 and Unit 3</p>'
      : '<div class="unit-title">' + u.title + '</div><p class="unit-sub">' + u.sub + '</p>';

    main.innerHTML = renderMessagesCard() + header + body;

    main.querySelectorAll(".speak[data-say]").forEach(b => b.onclick = () => speak(b.dataset.say));
    main.querySelectorAll("[data-dismiss]").forEach(b => b.onclick = () => {
      dismissMessage(Number(b.dataset.dismiss));
      renderAll();
    });
    if (tabName === "exercises") wireExercises(u);
    if (tabName === "dictation") wireDictation();
  }

  // ===== Start =====
  async function boot() {
    await loadExtras();
    if (studentName) {
      await loadDict();
      await loadMessages();
      tabName = "dictation";
    }
    renderAll();

    // كل دقيقة يشوف إذا فيه رسالة جديدة
    setInterval(async () => {
      if (!studentName) return;
      const before = myMessages.map(m => m.id).join(",");
      await loadMessages();
      const after = myMessages.map(m => m.id).join(",");
      if (before !== after) renderAll();
    }, 60000);
  }
  boot();
</script>
</body>
</html>
